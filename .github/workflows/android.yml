name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Implicit actiunea cere pachetul "tools", care nu mai exista in sdkmanager nou
          # ("Failed to find package 'tools'"). Gradle isi descarca singur ce are nevoie.
          packages: ''

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Daca ai adaugat secretele de semnare (vezi README), APK-ul se semneaza cu cheia ta.
      # Daca nu, se semneaza cu cheia de debug (instalabil, dar fara actualizari peste o versiune semnata altfel).
      - name: Pregateste keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vicproj.jks"
            echo "VICPROJ_KEYSTORE_PATH=$RUNNER_TEMP/vicproj.jks" >> "$GITHUB_ENV"
            echo "Keystore gasit - APK semnat cu cheia proprie."
          else
            echo "Fara keystore - APK semnat cu cheia de debug."
          fi

      - name: Build APK (release)
        env:
          VICPROJ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VICPROJ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VICPROJ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Redenumeste APK-ul
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/vicproj.apk
          ls -la dist

      - name: Incarca APK-ul (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: vicproj-apk
          path: dist/vicproj.apk
          if-no-files-found: error

      - name: Ataseaza APK-ul la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vicproj.apk
